<nav class="w-full pt-11.25 max-md:pt-5 max-md:fixed max-md:top-0 max-md:left-0 max-md:z-100 max-md:bg-app-bg"
     aria-label="Hauptnavigation">
  <div class="container h-34.25 flex items-center justify-between max-md:h-20">

    <button
      type="button"
      class="hidden max-md:flex flex-col gap-1.5 cursor-pointer z-101 p-2.5 rounded-md
             focus:outline-none focus-visible:ring-2 focus-visible:ring-dark focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg"
      [attr.aria-label]="isMenuOpen() ? 'Menü schliessen' : 'Menü öffnen'"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="hauptnavigation"
      (click)="toggleMenu()">
      <span class="block w-6.25 h-0.5 bg-dark transition-all duration-200"
            [class]="isMenuOpen() ? 'rotate-45 translate-y-2' : ''"></span>
      <span class="block w-6.25 h-0.5 bg-dark transition-all duration-200"
            [class]="isMenuOpen() ? 'opacity-0' : ''"></span>
      <span class="block w-6.25 h-0.5 bg-dark transition-all duration-200"
            [class]="isMenuOpen() ? '-rotate-45 -translate-y-2' : ''"></span>
    </button>

    <ul id="hauptnavigation"
        class="flex list-none p-0 m-0 gap-5 lg:gap-6.25 max-[1200px]:gap-3.75
               max-md:fixed max-md:top-20 max-md:left-0 max-md:w-full max-md:h-[calc(100dvh-5rem)]
               max-md:bg-app-bg max-md:flex-col max-md:items-center max-md:justify-center
               max-md:py-10 max-md:z-99 max-md:overflow-y-auto
               max-md:transition-all max-md:duration-300"
        [class]="isMenuOpen()
          ? 'max-md:opacity-100 max-md:visible max-md:translate-y-0'
          : 'max-md:opacity-0 max-md:invisible max-md:-translate-y-5'">
      @for (link of navLinks; track link.label) {
        <li class="relative max-md:w-full max-md:flex max-md:flex-col max-md:items-center"
            (mouseenter)="openDropdownFor(link.label)"
            (mouseleave)="closeDropdown()">

          @if (link.children) {
            <button type="button"
                    class="font-bold text-base uppercase text-dark tracking-widest inline-flex items-center gap-1.5 rounded-md
                           transition-[color,transform] duration-200 hover:text-primary hover:-translate-y-0.5 active:translate-y-0
                           focus:outline-none focus-visible:ring-2 focus-visible:ring-dark focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg
                           max-md:text-2xl"
                    aria-haspopup="true"
                    [attr.aria-expanded]="openDropdown() === link.label"
                    (click)="toggleDropdown(link.label)">
              {{ link.label }}
              <svg class="w-2.5 h-2.5 opacity-60 transition-transform duration-200"
                   [class.rotate-180]="openDropdown() === link.label"
                   viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path d="M2 4.5 6 8.5 10 4.5" stroke="currentColor" stroke-width="1.75"
                      stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <div class="absolute top-full left-0 z-100 pt-2.5 min-w-56 origin-top
                        transition-[opacity,transform] duration-150 ease-out
                        max-md:static max-md:pt-4 max-md:min-w-0 max-md:w-full"
                 [class]="openDropdown() === link.label
                   ? 'opacity-100 visible translate-y-0 scale-100'
                   : 'opacity-0 invisible -translate-y-1 scale-[0.98] max-md:hidden'">
              <ul class="list-none m-0 p-1.5 flex flex-col rounded-2xl bg-app-bg/95 backdrop-blur-md
                         ring-1 ring-dark/10
                         shadow-[0_1px_2px_rgba(55,56,65,0.05),0_10px_15px_-3px_rgba(55,56,65,0.10),0_20px_40px_-12px_rgba(55,56,65,0.18)]
                         max-md:bg-transparent max-md:ring-0 max-md:shadow-none max-md:backdrop-blur-none
                         max-md:p-0 max-md:gap-3.75 max-md:items-center">
                @for (child of link.children; track child.path) {
                  <li class="max-md:w-full">
                    <a [routerLink]="child.path"
                       routerLinkActive
                       #rla="routerLinkActive"
                       class="relative flex items-center rounded-xl px-4 py-2.5
                              text-[13px] font-bold uppercase tracking-[0.14em] whitespace-nowrap
                              transition-colors duration-150 hover:opacity-100
                              focus:outline-none focus-visible:ring-2 focus-visible:ring-dark focus-visible:ring-inset
                              max-md:text-xl max-md:tracking-widest max-md:justify-center max-md:rounded-none max-md:px-0 max-md:py-0"
                       [class]="rla.isActive
                         ? 'text-dark bg-primary/20 max-md:bg-transparent max-md:text-primary'
                         : 'text-dark/75 hover:text-dark hover:bg-dark/6 max-md:hover:bg-transparent'"
                       (click)="closeMenu()">
                      @if (rla.isActive) {
                        <span aria-hidden="true"
                              class="absolute left-1.5 top-1/2 -translate-y-1/2 h-4 w-0.75 rounded-full bg-primary max-md:hidden"></span>
                      }
                      {{ child.label }}
                    </a>
                  </li>
                }
              </ul>
            </div>
          } @else {
            <a [routerLink]="link.path"
               routerLinkActive="text-primary"
               class="font-bold text-base uppercase text-dark tracking-widest inline-block rounded-md
                      transition-[color,transform] duration-200 hover:text-primary hover:opacity-100 hover:-translate-y-0.5 active:translate-y-0
                      focus:outline-none focus-visible:ring-2 focus-visible:ring-dark focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg
                      max-md:text-2xl"
               (click)="closeMenu()">
              {{ link.label }}
            </a>
          }

        </li>
      }
    </ul>

    <div class="h-full flex items-center">
      <a routerLink="/"
         class="block h-full rounded-md hover:opacity-100
                focus:outline-none focus-visible:ring-2 focus-visible:ring-dark focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg"
         (click)="closeMenu()">
        <img src="/assets/images/logo.svg" alt="Pfadi St. Justus Flums — zur Startseite"
             class="h-34.25 w-auto block transition-transform duration-200 hover:scale-[1.02] max-md:h-15">
      </a>
    </div>

  </div>
</nav>
